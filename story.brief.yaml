version: 1
blueprint: demo-blueprint.yaml
presentation:
  title: Sovereign AI 201 — Build the Governed Inference Boundary
  audience: AI platform engineers and governance reviewers
  desired_decision: Adopt the fail-closed governed inference boundary as the Sovereign AI 201 construction baseline
  duration_minutes: 7
  core_tension: A local model is not a governed workload until its contract, destinations, credentials, failures, evidence, and decision owner are explicit.
  cta: Open the separate Showroom and construct, qualify, review, and reclaim the same boundary.
source_material:
  mode: repository
  items:
    - /Users/jkershaw/Documents/sovereign-ai-lab
    - demo-blueprint.yaml
  consequential_assumptions:
    - The upstream repository is discovery evidence, not the 201 runtime implementation.
    - The upstream adapter's fail-open behavior is not inherited; 201 fails closed.
    - A model, provider, hardware identity, or advisory is claimed only from a complete LIVE response.
    - REHEARSAL qualifies deterministic mechanics without claiming model participation.
    - Confidential execution and certification remain outside 201.
architecture:
  actors: [Platform engineer, Human governance reviewer]
  boundaries: [Versioned request contract, Deterministic residency and model policy, Runtime Secret reference, OpenShift Service and NetworkPolicy, Approved model endpoint, Redacted evidence API, Human authority]
  critical_flows: [qualify-governed-request, fail-closed-conditions]
  omitted_from_main_story: [Model training internals, Confidential guest and TDX attestation, Certification and promotion authority]
beats:
  - {beat: ordinary-world, claim: A local endpoint does not prove a governed sovereign workload.}
  - {beat: stakes, claim: Implicit residency credentials reachability failure behavior and authority make the claim unreviewable.}
  - {beat: reframe, claim: Move sovereignty into a versioned observable inference boundary.}
  - {beat: system-reveal, claim: Separate request validation deterministic policy network and Secret controls inference evidence and human authority.}
  - {beat: live-proof, claim: Run allowed denied injection unavailable and evidence conditions through one typed path.}
  - {beat: trials, claim: Every rejected or unavailable condition returns no model identity or advisory.}
  - {beat: transformation, claim: Correlated evidence supports a human decision without granting authority.}
  - {beat: next-journey, claim: Build break review and reclaim the boundary in the separate Sovereign AI 201 Showroom.}
evidence:
  - {id: contract, claim: Request response and evidence shapes are versioned and executable, classification: verified-fact, source: contracts and tests/test_contracts.py, owner: Workload team, last_verified: 2026-09-28, treatment: Show the schema and qualification tests.}
  - {id: platform-controls, claim: Secret references Service and NetworkPolicy encode the intended OpenShift boundary without checked-in values, classification: verified-fact, source: charts/sovereign-ai-201, owner: Platform team, last_verified: 2026-09-28, treatment: Render and inspect the chart.}
  - {id: failure-matrix, claim: Denied malformed injection and unavailable conditions fail closed with no model content, classification: verified-fact, source: tests/test_workload.py, owner: Workload team, last_verified: 2026-09-28, treatment: Run the executable matrix and retain typed evidence.}
  - {id: inference, claim: The configured approved model participated on the declared provider and hardware, classification: live-measurement, source: POST /api/v1/qualify, owner: Runtime platform, last_verified: null, treatment: Claim only from a complete LIVE response otherwise label REHEARSAL or OFFLINE.}
  - {id: review, claim: Correlation evidence omits prompts and Secret values and leaves final authority with a named human, classification: verified-fact, source: GET /api/v1/evidence/{id}, owner: Governance reviewer, last_verified: 2026-09-28, treatment: Inspect the redacted record and record an external disposition.}
live_systems:
  - {id: qualification-adapter, endpoint: /api/v1, timeout: bounded per adapter, fallback: typed REHEARSAL or OFFLINE results with visible source state and no fabricated model output}
journey:
  presentation: Seven-scene Triforce decision story
  live_demonstration: Five-step allowed denied injection unavailable and evidence comparison
  guided_demo: Instructor reveals each independent boundary and names the source state
  hands_on_lab: Separate Antora Showroom where learners author configure qualify review and reclaim
open_questions:
