adapter:
  replicas: 1
  mode: rehearsal
  image:
    repository: localhost/sovereign-ai-201-adapter
    tag: 0.1.0
    digest: ""
    pullPolicy: IfNotPresent
  policy:
    version: residency-v1
    approvedRegions: local,eu-central
    approvedModels: granite-3.2-sovereign
  model:
    secretName: ""
    timeoutSeconds: 60
    endpointKey: endpoint
    modelKey: model
    providerKey: provider
    hardwareKey: hardware
    apiKeyKey: api-key
    egressCIDR: ""
    egressPort: 443
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: 500m, memory: 256Mi}

presentation:
  enabled: true
  routeEnabled: true
  image:
    repository: localhost/sovereign-ai-201-presentation
    tag: 0.1.0
    digest: ""
    pullPolicy: IfNotPresent
  resources:
    requests: {cpu: 25m, memory: 32Mi}
    limits: {cpu: 100m, memory: 96Mi}
