apiVersion: apps/v1
kind: Deployment
metadata:
  name: sovereign-ai-201-adapter
  labels:
    app.kubernetes.io/name: sovereign-ai-201-adapter
    {{- include "sovereign-ai-201.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.adapter.replicas }}
  selector:
    matchLabels: {app.kubernetes.io/name: sovereign-ai-201-adapter}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sovereign-ai-201-adapter
        {{- include "sovereign-ai-201.labels" . | nindent 8 }}
    spec:
      serviceAccountName: sovereign-ai-201
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: adapter
          image: {{ include "sovereign-ai-201.image" .Values.adapter.image | quote }}
          imagePullPolicy: {{ .Values.adapter.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          ports: [{name: http, containerPort: 8080}]
          env:
            - {name: ADAPTER_MODE, value: {{ .Values.adapter.mode | quote }}}
            - {name: POLICY_VERSION, value: {{ .Values.adapter.policy.version | quote }}}
            - {name: APPROVED_REGIONS, value: {{ .Values.adapter.policy.approvedRegions | quote }}}
            - {name: APPROVED_MODELS, value: {{ .Values.adapter.policy.approvedModels | quote }}}
            {{- if .Values.adapter.model.secretName }}
            - name: MODEL_ENDPOINT
              valueFrom: {secretKeyRef: {name: {{ .Values.adapter.model.secretName | quote }}, key: {{ .Values.adapter.model.endpointKey | quote }}}}
            - name: MODEL_ID
              valueFrom: {secretKeyRef: {name: {{ .Values.adapter.model.secretName | quote }}, key: {{ .Values.adapter.model.modelKey | quote }}}}
            - name: MODEL_PROVIDER
              valueFrom: {secretKeyRef: {name: {{ .Values.adapter.model.secretName | quote }}, key: {{ .Values.adapter.model.providerKey | quote }}}}
            - name: MODEL_HARDWARE
              valueFrom: {secretKeyRef: {name: {{ .Values.adapter.model.secretName | quote }}, key: {{ .Values.adapter.model.hardwareKey | quote }}}}
            - name: MODEL_API_KEY
              valueFrom: {secretKeyRef: {name: {{ .Values.adapter.model.secretName | quote }}, key: {{ .Values.adapter.model.apiKeyKey | quote }}}}
            {{- end }}
          readinessProbe: {httpGet: {path: /healthz, port: http}, initialDelaySeconds: 2, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /healthz, port: http}, initialDelaySeconds: 5, periodSeconds: 10}
          resources: {{- toYaml .Values.adapter.resources | nindent 12 }}

