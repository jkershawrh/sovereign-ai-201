apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sovereign-ai-201-adapter-default-deny
  labels:
    {{- include "sovereign-ai-201.labels" . | nindent 4 }}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: sovereign-ai-201-adapter}}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sovereign-ai-201-declared-paths
  labels:
    {{- include "sovereign-ai-201.labels" . | nindent 4 }}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: sovereign-ai-201-adapter}}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app.kubernetes.io/name: sovereign-ai-201-presentation}}
        # The Launchpad Showroom pod hosts the learner terminal. Admit that
        # namespace-local client without opening the adapter to every pod.
        - podSelector: {matchLabels: {app.kubernetes.io/name: showroom}}
        - podSelector: {matchLabels: {demo.redhat-intel.com/role: learner-client}}
      ports: [{protocol: TCP, port: 8080}]
  egress:
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: openshift-dns}}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
        # OpenShift's dns-default Service translates 53 to the daemonset's
        # named target port 5353. NetworkPolicy enforcement may observe the
        # post-DNAT port, so admit both without opening any other destination.
        - {protocol: UDP, port: 5353}
        - {protocol: TCP, port: 5353}
    {{- if .Values.adapter.model.egressCIDR }}
    - to:
        - ipBlock: {cidr: {{ .Values.adapter.model.egressCIDR | quote }}}
      ports: [{protocol: TCP, port: {{ .Values.adapter.model.egressPort }} }]
    {{- end }}
    {{- if .Values.adapter.model.egressNamespace }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.adapter.model.egressNamespace | quote }}
          {{- if .Values.adapter.model.egressPodName }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ .Values.adapter.model.egressPodName | quote }}
          {{- end }}
      ports: [{protocol: TCP, port: {{ .Values.adapter.model.egressPort }} }]
    {{- end }}
    {{- if .Values.adapter.dnsEgressCIDR }}
    - to:
        - ipBlock: {cidr: {{ .Values.adapter.dnsEgressCIDR | quote }}}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
        - {protocol: UDP, port: 5353}
        - {protocol: TCP, port: 5353}
    {{- end }}
    {{- if .Values.adapter.dnsServiceCIDR }}
    - to:
        - ipBlock: {cidr: {{ .Values.adapter.dnsServiceCIDR | quote }}}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
        - {protocol: UDP, port: 5353}
        - {protocol: TCP, port: 5353}
    {{- end }}
