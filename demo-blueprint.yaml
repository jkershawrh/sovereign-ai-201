intent:
  primary_user: AI platform engineer who completed Sovereign AI 101 or can already trace policy, inference, evidence, and authority.
  workload: A learner-authored contract constrains residency, identity, model routing, Secret references, Service reachability, NetworkPolicy, evidence, and human authority around one bounded inference request.
  recognized_problem: A local model is not a governed sovereign workload when its request contract, destinations, credentials, failures, evidence, and decision owner remain implicit.
  audience_decision: Approve a construction-level 201 lab that makes the governed inference boundary explicit and fail closed.
  desired_outcome: The learner leaves with schemas, a client, OpenShift resources, five qualified outcomes, a redacted evidence map, human disposition, and reclaim receipt.
architecture:
  actors:
    - {id: learner, name: Platform engineer, kind: human, responsibility: Authors and executes the boundary and maps evidence to claims, status: verified, source: showroom/content/modules/ROOT/pages}
    - {id: reviewer, name: Human governance reviewer, kind: human, responsibility: Accepts or rejects the evidence package and owns the final decision, status: verified, source: contracts/governed-response.schema.json}
  runtime_objects:
    - {id: presentation, name: Presentation client, kind: apps/v1 Deployment, responsibility: Runs typed proof calls and preserves condition history with source labels, status: verified, source: src/live/sovereignAdapter.ts}
    - {id: adapter-service, name: Qualification adapter Service, kind: v1 Service, responsibility: Provides stable namespace-local DNS for the governed boundary, status: verified, source: charts/sovereign-ai-201/templates/service.yaml}
    - {id: adapter, name: Qualification adapter, kind: apps/v1 Deployment, responsibility: Validates schema, evaluates policy and injection, invokes only an approved live model, and records redacted evidence, status: verified, source: workload/app.py}
    - {id: runtime-secret, name: Model runtime Secret reference, kind: v1 Secret reference, responsibility: Supplies endpoint, model, provider, hardware, and credential without values in source or requests, status: verified, source: charts/sovereign-ai-201/templates/adapter.yaml}
    - {id: network-policy, name: Governed NetworkPolicy, kind: networking.k8s.io/v1 NetworkPolicy, responsibility: Default-denies the adapter then admits declared clients, DNS, and optional approved model egress, status: verified, source: charts/sovereign-ai-201/templates/networkpolicy.yaml}
    - {id: model-endpoint, name: Approved OpenAI-compatible model endpoint, kind: external dependency, responsibility: Returns advisory text only after deterministic checks in LIVE mode, status: assumed, source: Deployment-time dependency}
    - {id: evidence-api, name: Correlated evidence API, kind: HTTP API, responsibility: Exposes in-memory redacted factory evidence by evidence ID, status: verified, source: workload/app.py}
  boundaries:
    - {id: contract-boundary, name: Versioned request boundary, kind: schema, responsibility: Rejects incomplete, incompatible, or credential-bearing input before inference, status: verified, source: contracts/governed-request.schema.json}
    - {id: residency-boundary, name: Data residency policy, kind: deterministic-policy, responsibility: Intersects declared destinations with platform-approved regions and models, status: verified, source: workload/app.py}
    - {id: credential-boundary, name: Runtime credential boundary, kind: secret, responsibility: Keeps endpoint identity and credential outside source, browser, request, fixtures, and evidence, status: verified, source: charts/sovereign-ai-201/templates/adapter.yaml}
    - {id: network-boundary, name: Namespace network boundary, kind: network, responsibility: Limits adapter ingress and egress to declared paths, status: verified, source: charts/sovereign-ai-201/templates/networkpolicy.yaml}
    - {id: authority-boundary, name: Human authority boundary, kind: authority, responsibility: Keeps model output advisory and certification or promotion external, status: verified, source: contracts/governed-response.schema.json}
  external_dependencies:
    - {id: openshift, name: Red Hat OpenShift, kind: platform, responsibility: Runs namespace-scoped Services, Deployments, Route, and NetworkPolicy, status: assumed, source: Required live target capability}
    - {id: intel-model-runtime, name: Approved Intel CPU model runtime, kind: inference, responsibility: Supplies complete model, provider, and hardware identity with advisory output, status: assumed, source: Runtime Secret and live response}
  flows:
    - id: qualify-governed-request
      name: Qualify the governed inference boundary
      kind: request
      trigger: Learner submits a versioned request through the Service.
      outcome: The adapter returns one typed allowed or fail-closed response plus redacted evidence for human review.
      edges:
        - {from: learner, to: presentation, purpose: author or select a bounded condition, protocol: browser or Python client, evidenceIds: [authored-contract]}
        - {from: presentation, to: adapter-service, purpose: submit request with correlation identity, protocol: 'HTTP JSON POST /api/v1/qualify', evidenceIds: [condition-response]}
        - {from: adapter-service, to: adapter, purpose: select the qualification workload, protocol: 'Kubernetes Service TCP :8080', evidenceIds: [network-contract]}
        - {from: runtime-secret, to: adapter, purpose: project model identity and credential only at runtime, protocol: SecretKeyRef environment projection, evidenceIds: [secret-isolation]}
        - {from: network-policy, to: adapter, purpose: enforce declared ingress and egress, protocol: Kubernetes NetworkPolicy, evidenceIds: [network-contract]}
        - {from: adapter, to: model-endpoint, purpose: invoke only after schema, injection, residency, and model policy allow, protocol: OpenAI-compatible HTTPS JSON, evidenceIds: [model-participation]}
        - {from: adapter, to: evidence-api, purpose: store redacted correlation and request hash, protocol: in-process record plus HTTP GET, evidenceIds: [correlated-evidence]}
        - {from: evidence-api, to: reviewer, purpose: support accept or reject without granting authority, protocol: 'HTTP GET /api/v1/evidence/{id}', evidenceIds: [human-decision]}
    - id: fail-closed-conditions
      name: Qualify rejected and unavailable conditions
      kind: decision
      trigger: The learner changes residency, input validity, injection content, or dependency availability.
      outcome: The response contains no model or advisory content and preserves correlation evidence.
      edges:
        - {from: adapter, to: evidence-api, purpose: record POLICY_DENIED, MALFORMED_REQUEST, INJECTION_BLOCKED, or DEPENDENCY_UNAVAILABLE, protocol: typed internal record, evidenceIds: [failure-matrix]}
        - {from: evidence-api, to: reviewer, purpose: expose the failed boundary and absence of model participation, protocol: HTTP JSON, evidenceIds: [failure-matrix, human-decision]}
operational_pattern:
  name: Map, author, wire, allow, deny, break, review, reclaim
  rationale: Level 201 is earned by constructing and qualifying the boundary rather than replaying the 101 trace.
  steps:
    - {id: map, label: Map residency and trust, question: Which identity data model network and human authority boundaries are in scope?, flowIds: [qualify-governed-request], evidenceIds: [authored-contract]}
    - {id: author, label: Author the contract and client, question: Can malformed or credential-bearing input be rejected before inference?, flowIds: [qualify-governed-request, fail-closed-conditions], evidenceIds: [authored-contract, failure-matrix]}
    - {id: wire, label: Wire the platform controls, question: Do Secret references Service and NetworkPolicy encode the intended boundary without values?, flowIds: [qualify-governed-request], evidenceIds: [secret-isolation, network-contract]}
    - {id: allow, label: Qualify the allowed path, question: Does the source state prove whether the approved model actually participated?, flowIds: [qualify-governed-request], evidenceIds: [condition-response, model-participation]}
    - {id: deny, label: Change the residency condition, question: Does policy denial prevent any model output?, flowIds: [fail-closed-conditions], evidenceIds: [failure-matrix]}
    - {id: break, label: Exercise malformed injection and unavailable paths, question: Does every failed dependency or input remain attributable and fail closed?, flowIds: [fail-closed-conditions], evidenceIds: [failure-matrix]}
    - {id: review, label: Review correlation and authority, question: Can a human map every outcome to evidence and limitations without exposing sensitive values?, flowIds: [qualify-governed-request], evidenceIds: [correlated-evidence, human-decision]}
    - {id: reclaim, label: Reclaim the workload, question: Can the learner remove only assigned resources and prove zero residue?, flowIds: [qualify-governed-request], evidenceIds: [reclaim-receipt]}
  changed_condition: The same contract changes from an approved local destination to policy denial, injection, malformed input, and dependency unavailability; no failed branch may contain model output.
  close: The named human accepts or rejects the evidence package and records limits; Launchpad independently owns certification and promotion.
evidence:
  - {id: authored-contract, name: Contract authoring receipt, source: contracts and learner working copy, collection: schema and client validation, supports: Learner constructed the boundary, status: verified}
  - {id: secret-isolation, name: Secret isolation receipt, source: Helm render and source scan, collection: Secret references exist and no values appear, supports: Runtime credential isolation, status: verified}
  - {id: network-contract, name: Network boundary receipt, source: Helm render, collection: default deny and declared allow paths, supports: Reviewable connectivity policy, status: verified}
  - {id: condition-response, name: Typed condition response, source: qualification adapter, collection: POST /api/v1/qualify, supports: Allowed and failed outcomes are distinguishable, status: verified}
  - {id: model-participation, name: Model participation identity, source: LIVE adapter response only, collection: complete model provider hardware identity and advisory, supports: Named model participation only when LIVE, status: assumed}
  - {id: failure-matrix, name: Fail-closed matrix, source: adapter tests and runtime calls, collection: denied malformed injection and unavailable outcomes, supports: No unauthorized or fabricated model output, status: verified}
  - {id: correlated-evidence, name: Redacted evidence record, source: evidence API, collection: correlation ID request hash policy outcome source state and authority, supports: Attributable review without prompt or Secret values, status: verified}
  - {id: human-decision, name: Human disposition, source: evidence map, collection: named accept or reject with limits, supports: Authority remains human-owned, status: verified}
  - {id: reclaim-receipt, name: Reclaim receipt, source: learner OpenShift inventory, collection: before and after labeled resources, supports: Assigned workload cleanup, status: assumed}
decisions:
  - {id: contract-acceptance, owner: Qualification adapter, policy: Require the exact versioned request fields and reject secret-like keys, failClosedBehavior: Return MALFORMED_REQUEST before policy or inference, status: verified}
  - {id: policy-allow-deny, owner: Platform policy configuration, policy: Intersect request destinations and model with platform-approved values, failClosedBehavior: Return POLICY_DENIED with no advisory, status: verified}
  - {id: injection-boundary, owner: Qualification adapter, policy: Reject declared injection patterns before inference, failClosedBehavior: Return INJECTION_BLOCKED with no advisory, status: verified}
  - {id: dependency-boundary, owner: Qualification adapter, policy: Require complete LIVE model identity and valid output, failClosedBehavior: Return DEPENDENCY_UNAVAILABLE and OFFLINE with no advisory, status: verified}
  - {id: human-review, owner: Human governance reviewer, policy: Evidence supports but never grants certification deployment or promotion authority, failClosedBehavior: Missing or mixed evidence remains unqualified, status: verified}
ai_assessment:
  needed: true
  kind: generative-llm
  rationale: The model may draft a bounded advisory response only after deterministic contract and policy gates; the lab's decisions and evidence do not depend on model judgment.
  tasks: [Draft one response to an allowed bounded prompt]
  inputs: [Approved prompt and configured model identity]
  outputs: [Advisory text]
  model_identity_source: LIVE response populated from runtime Secret references
  hardware_identity_source: LIVE runtime Secret plus independently reviewed platform placement
  evidence_access: [The model receives only the approved prompt and cannot read the evidence store or Secret values]
  action_authority: none
  validation: [Response shape is validated, Every failed path forbids model and advisory fields, Human review remains required]
  fallback: REHEARSAL qualifies deterministic mechanics without model participation; unavailable dependencies return OFFLINE and no advisory.
  final_decision_owner: Human governance reviewer
story_mapping:
  audience_question: Can we build a boundary that proves what was allowed denied or unavailable without letting the model define sovereignty?
  stakes: [Implicit residency credentials networking failures and authority cannot support a reviewable sovereign workload claim.]
  architecture_flow_ids: [qualify-governed-request, fail-closed-conditions]
  live_proof_flow_ids: [qualify-governed-request, fail-closed-conditions]
  comparison: Allowed local request versus denied injection and unavailable outcomes through the same contract
  payoff: Correlated evidence preserves source state model participation and human authority across every condition.
  next_journey: Open the separate Sovereign AI 201 Showroom to author qualify review and reclaim the boundary.
